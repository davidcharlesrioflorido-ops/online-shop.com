<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070a10"
    >

    <title>Admin Chat | Business Store</title>

    <script
    type="module"
    src="./js/admin-guard.js"
> </script>

    <link
        rel="stylesheet"
     href="css/admin.css"
    >

    <style>

        /* =========================================================
           BUSINESS STORE
           ADMIN CHAT
           DARK PREMIUM / NEON GLASS
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #070a10;
        }

        body {
            color: #f5f7fa;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================================
           PAGE
           ========================================================= */

        .admin-chat-page {
            width: 100%;
            height: 100vh;
            min-height: 100vh;

            padding: 20px;

            display: flex;
            flex-direction: column;
        }

        /* =========================================================
           PAGE HEADER
           ========================================================= */

        .chat-page-header {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
            margin-bottom: 16px;
        }

        .chat-page-left {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 11px;
        }

        .back-dashboard-button {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px;

            background: rgba(255,255,255,.035);

            color: #aeb7c5;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease,
                transform .15s ease;
        }

        .back-dashboard-button:hover {
            color: #00f2fe;

            border-color:
                rgba(0,242,254,.30);

            background:
                rgba(0,242,254,.055);
        }

        .back-dashboard-button:active {
            transform: scale(.94);
        }

        .chat-page-title {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 13px;
        }

        .chat-page-title-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,242,254,.16),
                    rgba(124,58,237,.18)
                );

            border:
                1px solid rgba(255,255,255,.08);

            color: #00f2fe;

            font-size: 21px;

            box-shadow:
                0 8px 30px rgba(0,0,0,.18);
        }

        .chat-title-text {
            min-width: 0;
        }

        .chat-page-title h1 {
            margin: 0;

            color: #fff;

            font-size: 22px;
            line-height: 1.2;
            font-weight: 800;
        }

        .chat-page-title p {
            margin: 4px 0 0;

            color: #7e8999;

            font-size: 12px;
        }

        /* =========================================================
           ADMIN CONNECTION STATUS
           ========================================================= */

        .chat-status {
            flex: 0 0 auto;

            display: flex;
            align-items: center;

            gap: 8px;

            padding: 8px 13px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid rgba(255,255,255,.07);

            color: #aeb7c5;

            font-size: 12px;
        }

        .chat-status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #f5cf6b;
        }

        .chat-status.online {
            color: #35e889;

            border-color:
                rgba(53,232,137,.22);

            background:
                rgba(53,232,137,.055);
        }

        .chat-status.online .chat-status-dot {
            background: #35e889;

            box-shadow:
                0 0 12px rgba(53,232,137,.7);
        }

        .chat-status.offline {
            color: #ff6b6b;

            border-color:
                rgba(255,107,107,.22);

            background:
                rgba(255,107,107,.055);
        }

        .chat-status.offline .chat-status-dot {
            background: #ff6b6b;

            box-shadow:
                0 0 12px rgba(255,107,107,.65);
        }

        .chat-status.connecting {
            color: #f5cf6b;

            border-color:
                rgba(245,207,107,.22);

            background:
                rgba(245,207,107,.055);
        }

        .chat-status.connecting .chat-status-dot {
            background: #f5cf6b;

            box-shadow:
                0 0 12px rgba(245,207,107,.65);
        }

        /* =========================================================
           MAIN CHAT CONTAINER
           ========================================================= */

        .admin-chat-container {
            flex: 1;
            min-height: 0;

            width: 100%;

            display: grid;

            grid-template-columns:
                350px minmax(0,1fr);

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(14,18,27,.97),
                    rgba(8,11,17,.97)
                );

            box-shadow:
                0 25px 80px rgba(0,0,0,.38),
                inset 0 1px 0 rgba(255,255,255,.025);
        }

        /* =========================================================
           CONVERSATIONS PANEL
           ========================================================= */

        .conversations-panel {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            border-right:
                1px solid rgba(255,255,255,.07);

            background:
                rgba(5,8,13,.72);
        }

        .conversations-header {
            flex: 0 0 auto;

            padding: 17px;

            border-bottom:
                1px solid rgba(255,255,255,.065);
        }

        .conversations-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 13px;
        }

        .conversations-title-left {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .conversations-header h2 {
            margin: 0;

            color: #f5f7fa;

            font-size: 15px;
            font-weight: 800;
        }

        .conversation-count {
            min-width: 23px;
            height: 23px;

            padding: 0 7px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 999px;

            background:
                rgba(0,242,254,.10);

            border:
                1px solid rgba(0,242,254,.18);

            color: #00f2fe;

            font-size: 10px;
            font-weight: 800;
        }

        .dashboard-link {
            display: inline-flex;
            align-items: center;

            gap: 6px;

            padding: 7px 9px;

            border-radius: 9px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid rgba(255,255,255,.07);

            color: #8f9aac;

            font-size: 10px;
            font-weight: 700;

            text-decoration: none;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease;
        }

        .dashboard-link:hover {
            color: #00f2fe;

            border-color:
                rgba(0,242,254,.25);

            background:
                rgba(0,242,254,.05);
        }

        /* =========================================================
           SEARCH
           ========================================================= */

        .search-box {
            position: relative;
        }

        .search-box-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #687386;

            font-size: 13px;

            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            height: 41px;

            border:
                1px solid rgba(255,255,255,.075);

            border-radius: 12px;

            outline: none;

            padding:
                0 13px 0 37px;

            background:
                rgba(255,255,255,.035);

            color: #fff;

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .search-box input::placeholder {
            color: #596477;
        }

        .search-box input:focus {
            border-color:
                rgba(0,242,254,.38);

            background:
                rgba(255,255,255,.045);
        }

        /* =========================================================
           FILTERS
           ========================================================= */

        .conversation-filters {
            display: grid;

            grid-template-columns:
                repeat(4,minmax(0,1fr));

            gap: 5px;

            margin-top: 10px;
        }

        .filter-button {
            min-width: 0;
            height: 31px;

            padding: 0 6px;

            border:
                1px solid rgba(255,255,255,.06);

            border-radius: 9px;

            background:
                rgba(255,255,255,.025);

            color: #697487;

            cursor: pointer;

            font-size: 9px;
            font-weight: 700;
        }

        .filter-button:hover {
            color: #cbd3dd;

            background:
                rgba(255,255,255,.045);
        }

        .filter-button.active {
            color: #00f2fe;

            border-color:
                rgba(0,242,254,.24);

            background:
                rgba(0,242,254,.07);
        }

        /* =========================================================
           CONVERSATION LIST
           ========================================================= */

        .conversation-list {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;
        }

        .conversation-list::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .conversation-list::-webkit-scrollbar-track,
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversation-list::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,.09);

            border-radius: 999px;
        }

        .conversation-item {
            position: relative;

            display: flex;
            align-items: flex-start;

            gap: 11px;

            padding: 14px 15px;

            cursor: pointer;

            border-bottom:
                1px solid rgba(255,255,255,.045);

            transition:
                background .18s ease,
                border-color .18s ease;
        }

        .conversation-item:hover {
            background:
                rgba(255,255,255,.035);
        }

        .conversation-item.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(0,242,254,.105),
                    rgba(124,58,237,.06)
                );

            border-left:
                3px solid #00f2fe;

            padding-left: 12px;
        }

        /* =========================================================
           AVATAR
           ========================================================= */

        .customer-avatar-wrap {
            position: relative;

            width: 49px;
            height: 49px;

            flex: 0 0 49px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
        }

        .customer-avatar {
            position: relative;

            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #00f2fe,
                    #7c3aed
                );

            color: #fff;

            font-size: 14px;
            font-weight: 900;

            overflow: visible;

            border:
                2px solid #596477;

            box-shadow:
                0 7px 20px rgba(0,0,0,.22);

            transition:
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .customer-avatar img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;
        }

        /* =========================================================
           ONLINE RING
           ========================================================= */

        .customer-avatar.status-online {
            border:
                2px solid #35e889;

            box-shadow:
                0 0 0 2px rgba(53,232,137,.18),
                0 0 17px rgba(53,232,137,.52),
                0 7px 20px rgba(0,0,0,.22);
        }

        .customer-avatar.status-online::after {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 50%;

            border:
                1px solid rgba(53,232,137,.42);

            pointer-events: none;

            animation:
                onlinePulse 2s ease-in-out infinite;
        }

        @keyframes onlinePulse {

            0%,
            100% {
                opacity: .65;
                transform: scale(1);
            }

            50% {
                opacity: .12;
                transform: scale(1.08);
            }
        }

        /* =========================================================
           OFFLINE RING
           ========================================================= */

        .customer-avatar.status-offline {
            border:
                2px solid #596477;

            box-shadow:
                0 0 0 2px rgba(89,100,119,.10),
                0 0 10px rgba(89,100,119,.12),
                0 7px 20px rgba(0,0,0,.22);
        }

        .customer-avatar.status-unknown {
            border:
                2px solid #596477;

            box-shadow:
                0 0 0 2px rgba(89,100,119,.08),
                0 7px 20px rgba(0,0,0,.22);
        }

        .avatar-online {
            display: none !important;
        }

        .customer-presence-label {
            display: inline-flex;
            align-items: center;

            gap: 4px;

            margin-top: 3px;

            font-size: 8px;
            font-weight: 700;
        }

        .customer-presence-label.online {
            color: #35e889;
        }

        .customer-presence-label.offline {
            color: #596477;
        }

        .customer-presence-label .presence-dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            flex: 0 0 5px;
        }

        .customer-presence-label.online .presence-dot {
            background: #35e889;

            box-shadow:
                0 0 7px rgba(53,232,137,.65);
        }

        .customer-presence-label.offline .presence-dot {
            background: #596477;
        }

        /* =========================================================
           CONVERSATION INFO
           ========================================================= */

        .conversation-info {
            min-width: 0;
            flex: 1;
        }

        .conversation-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 7px;
        }

        .customer-name {
            min-width: 0;

            color: #edf1f6;

            font-size: 13px;
            font-weight: 750;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            flex: 0 0 auto;

            color: #596477;

            font-size: 9px;

            white-space: nowrap;
        }

        .conversation-email {
            margin-top: 3px;

            color: #596477;

            font-size: 9px;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview-row {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-top: 5px;
        }

        .conversation-preview {
            min-width: 0;
            flex: 1;

            color: #778296;

            font-size: 11px;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            min-width: 20px;
            height: 20px;

            padding: 0 6px;

            flex: 0 0 auto;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 999px;

            background: #00f2fe;

            color: #031014;

            font-size: 9px;
            font-weight: 950;
        }

        .no-chat-label {
            color: #4f5a6c;

            font-size: 10px;

            font-style: italic;
        }

        .empty-conversations {
            padding: 60px 20px;

            text-align: center;

            color: #626d80;
        }

        .empty-conversations-icon {
            width: 55px;
            height: 55px;

            margin:
                0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                rgba(255,255,255,.025);

            color: #3d4655;

            font-size: 22px;
        }

        .empty-conversations strong {
            display: block;

            color: #8a95a6;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .empty-conversations span {
            font-size: 11px;
        }

        /* =========================================================
           CHAT PANEL
           ========================================================= */

        .chat-panel {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        /* =========================================================
           CHAT HEADER
           ========================================================= */

        .chat-header {
            flex: 0 0 auto;

            min-height: 72px;

            display: flex;
            align-items: center;

            gap: 11px;

            padding:
                12px 18px;

            border-bottom:
                1px solid rgba(255,255,255,.065);

            background:
                rgba(10,14,21,.78);

            backdrop-filter:
                blur(16px);
        }

        .chat-header-avatar-wrap {
            position: relative;

            width: 50px;
            height: 50px;

            flex: 0 0 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
        }

        .chat-header-avatar {
            position: relative;

            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #00f2fe,
                    #7c3aed
                );

            color: #fff;

            font-size: 14px;
            font-weight: 900;

            overflow: visible;

            border:
                2px solid #596477;
        }

        .chat-header-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border-radius: 50%;
        }

        .chat-header-avatar.status-online {
            border:
                2px solid #35e889;

            box-shadow:
                0 0 0 2px rgba(53,232,137,.18),
                0 0 18px rgba(53,232,137,.55),
                0 8px 24px rgba(0,0,0,.25);
        }

        .chat-header-avatar.status-online::after {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 50%;

            border:
                1px solid rgba(53,232,137,.45);

            pointer-events: none;

            animation:
                onlinePulse 2s ease-in-out infinite;
        }

        .chat-header-avatar.status-offline,
        .chat-header-avatar.status-unknown {
            border:
                2px solid #596477;

            box-shadow:
                0 0 0 2px rgba(89,100,119,.10),
                0 8px 24px rgba(0,0,0,.25);
        }

        .chat-customer-presence {
            display: flex;
            align-items: center;

            gap: 5px;

            margin-top: 4px;

            font-size: 9px;
            font-weight: 700;
        }

        .chat-customer-presence .presence-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            flex: 0 0 6px;
        }

        .chat-customer-presence.online {
            color: #35e889;
        }

        .chat-customer-presence.online .presence-dot {
            background: #35e889;

            box-shadow:
                0 0 8px rgba(53,232,137,.7);
        }

        .chat-customer-presence.offline {
            color: #596477;
        }

        .chat-customer-presence.offline .presence-dot {
            background: #596477;
        }

        .chat-header-info {
            min-width: 0;
            flex: 1;
        }

        .chat-header-info h3 {
            margin: 0;

            color: #f4f7fb;

            font-size: 14px;
            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-info p {
            margin: 4px 0 0;

            color: #687386;

            font-size: 10px;

            white-space: nowrap;

            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;

            gap: 7px;
        }

        .chat-icon-button {
            width: 37px;
            height: 37px;

            flex: 0 0 37px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255,255,255,.075);

            border-radius: 11px;

            background:
                rgba(255,255,255,.035);

            color: #9ba6b7;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease,
                transform .15s ease;
        }

        .chat-icon-button:hover {
            color: #00f2fe;

            border-color:
                rgba(0,242,254,.28);

            background:
                rgba(0,242,254,.055);
        }

        .chat-icon-button.delete-chat-button:hover {
            color: #ff6b6b;

            border-color:
                rgba(255,107,107,.30);

            background:
                rgba(255,107,107,.06);
        }

        .chat-icon-button:active {
            transform:
                scale(.95);
        }

        /* =========================================================
           MESSAGES
           ========================================================= */

        .chat-messages {
            flex: 1;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 22px;

            display: flex;
            flex-direction: column;

            gap: 11px;

            background:
                radial-gradient(
                    circle at 80% 15%,
                    rgba(0,242,254,.035),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(124,58,237,.035),
                    transparent 28%
                );
        }

        .chat-welcome {
            margin: auto;

            max-width: 350px;

            padding:
                30px 20px;

            text-align: center;

            color: #687386;
        }

        .chat-welcome-icon {
            width: 72px;
            height: 72px;

            margin:
                0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 23px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,242,254,.07),
                    rgba(124,58,237,.07)
                );

            border:
                1px solid rgba(255,255,255,.06);

            color: #00f2fe;

            font-size: 26px;
        }

        .chat-welcome h3 {
            margin:
                0 0 7px;

            color: #cbd2dc;

            font-size: 16px;
        }

        .chat-welcome p {
            margin: 0;

            color: #687386;

            font-size: 12px;

            line-height: 1.65;
        }

        .admin-message-row {
            width: 100%;

            display: flex;

            animation:
                messageIn .18s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        .admin-message-row.customer {
            justify-content: flex-start;
        }

        .admin-message-row.admin {

<script>

(() => {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    const wrapper =
        status?.closest(
            ".chat-status"
        );

    function setBrowserStatus(online) {

        if (!status || !wrapper) {
            return;
        }

        wrapper.classList.remove(
            "online",
            "offline",
            "connecting"
        );

        status.textContent =
            online
                ? "Online"
                : "Offline";

        wrapper.classList.add(
            online
                ? "online"
                : "offline"
        );
    }

    window.addEventListener(
        "online",
        () => {
            setBrowserStatus(true);
        }
    );

    window.addEventListener(
        "offline",
        () => {
            setBrowserStatus(false);
        }
    );

    if (!navigator.onLine) {
        setBrowserStatus(false);
    }

})();

</script>

/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    setupEvents();

    setConnectionStatus(
        "connecting"
    );

    try {

        await checkAdminSession();

        await loadCustomersAndConversations();

        await refreshCustomerActivity();

        setupProfileRealtime();

        startActivityRefresh();

        setupConversationRealtime();

        renderCustomerList(
            conversationSearch?.value || ""
        );

        setConnectionStatus(
            "online"
        );

    } catch (error) {

        console.error(
            "ADMIN CHAT INIT ERROR:",
            error
        );

        setConnectionStatus(
            "offline"
        );

        showError(
            friendlyError(error)
        );

    }

}


/* =========================================================
   ADMIN SESSION
   ========================================================= */

async function checkAdminSession() {

    const {
        data,
        error
    } = await supabase.auth.getUser();

    if (error) {
        throw error;
    }

    const user =
        data?.user;

    if (!user) {

        window.location.href =
            "index.html";

        return;

    }

    currentAdmin = user;

    /*
       Verify admin role.
    */

    const {
        data: profile,
        error: profileError
    } = await supabase
        .from("profiles")
        .select(
            "id,email,role,status"
        )
        .eq(
            "id",
            user.id
        )
        .maybeSingle();

    if (profileError) {
        throw profileError;
    }

    if (
        !profile ||
        profile.role !== "admin" ||
        profile.status !== "approved"
    ) {

        alert(
            "You are not authorized to access Admin Chat."
        );

        window.location.href =
            "index.html";

        return;

    }

}


/* =========================================================
   LOAD CUSTOMERS + CONVERSATIONS
   ========================================================= */

async function loadCustomersAndConversations() {

    showConversationLoading(true);

    try {

        /*
           Customers are taken from profiles.

           We only use customer accounts here.
        */

        const {
            data: customerRows,
            error: customerError
        } = await supabase
            .from("profiles")
            .select(
                "id,email,full_name,role,status,avatar_url,last_login"
            )
            .eq(
                "role",
                "customer"
            )
            .order(
                "full_name",
                {
                    ascending: true
                }
            );

        if (customerError) {
            throw customerError;
        }

        customers =
            customerRows || [];


        /*
           Load conversations.

           IMPORTANT:
           There is NO admin_id because your table
           does not have admin_id.
        */

        const {
            data: conversationRows,
            error: conversationError
        } = await supabase
            .from("chat_conversations")
            .select("*")
            .order(
                "last_message_at",
                {
                    ascending: false
                }
            );

        if (conversationError) {
            throw conversationError;
        }


        conversations =
            (conversationRows || [])
                .filter(
                    conversation =>
                        !deletedConversationIds.has(
                            conversation.id
                        )
                )
                .map(
                    conversation =>
                        normalizeConversation(
                            conversation
                        )
                );


        /*
           Merge profile data.
        */

        conversations =
            conversations.map(
                conversation => {

                    const customer =
                        customers.find(
                            item =>
                                item.id ===
                                conversation.customer_id
                        );

                    return {
                        ...conversation,
                        customer:
                            customer || null
                    };

                }
            );

    } finally {

        showConversationLoading(false);

    }

}


/* =========================================================
   NORMALIZE CONVERSATION
   ========================================================= */

function normalizeConversation(
    conversation
) {

    const customer =
        customers.find(
            item =>
                item.id ===
                conversation.customer_id
        ) || null;

    return {
        ...conversation,
        customer
    };

}


/* =========================================================
   RENDER CUSTOMER LIST
   ========================================================= */

function renderCustomerList(
    searchTerm = ""
) {

    if (!conversationList) {
        return;
    }

    const activeFilter =
        document.querySelector(
            ".filter-button.active"
        )?.dataset.filter ||
        "all";

    const search =
        String(searchTerm)
            .trim()
            .toLowerCase();


    /*
       Show ALL customers.

       A customer without a conversation
       is still visible.

       This is important because we no longer
       automatically recreate a deleted conversation.
    */

    let list =
        customers.map(
            customer => {

                const conversation =
                    conversations.find(
                        item =>
                            item.customer_id ===
                            customer.id
                    );

                return {
                    customer,
                    conversation
                };

            }
        );


    /*
       SEARCH
    */

    if (search) {

        list =
            list.filter(
                item => {

                    const customer =
                        item.customer;

                    const conversation =
                        item.conversation;

                    const text = [
                        customer?.full_name,
                        customer?.email,
                        conversation?.last_message
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                    return text.includes(
                        search
                    );

                }
            );

    }


    /*
       FILTER
    */

    if (activeFilter === "unread") {

        list =
            list.filter(
                item =>
                    Number(
                        item.conversation
                            ?.unread_for_admin || 0
                    ) > 0
            );

    }

    if (activeFilter === "active") {

        list =
            list.filter(
                item =>
                    item.conversation &&
                    item.conversation.status ===
                        "open"
            );

    }

    if (activeFilter === "no-reply") {

        list =
            list.filter(
                item =>
                    item.conversation &&
                    item.conversation.last_sender_type ===
                        "admin"
            );

    }


    /*
       Sort:
       1. customers with conversation
       2. latest conversation
       3. customer name
    */

    list.sort(
        (a,b) => {

            const aTime =
                a.conversation?.last_message_at
                    ? new Date(
                        a.conversation.last_message_at
                    ).getTime()
                    : 0;

            const bTime =
                b.conversation?.last_message_at
                    ? new Date(
                        b.conversation.last_message_at
                    ).getTime()
                    : 0;

            if (aTime !== bTime) {
                return bTime - aTime;
            }

            return String(
                a.customer?.full_name || ""
            ).localeCompare(
                String(
                    b.customer?.full_name || ""
                )
            );

        }
    );


    conversationCount.textContent =
        customers.length;


    if (!list.length) {

        conversationList.innerHTML = `
            <div class="empty-conversations">
                <div class="empty-conversations-icon">
                    💬
                </div>

                <strong>
                    No customers found
                </strong>

                <span>
                    Try another search or filter.
                </span>
            </div>
        `;

        return;

    }


    conversationList.innerHTML =
        list
            .map(
                item =>
                    renderCustomerItem(
                        item.customer,
                        item.conversation
                    )
            )
            .join("");


    /*
       Re-apply active selection.
    */

    if (selectedCustomer) {

        const active =
            conversationList.querySelector(
                `[data-customer-id="${selectedCustomer.id}"]`
            );

        active?.classList.add(
            "active"
        );

    }

}


/* =========================================================
   CUSTOMER LIST ITEM
   ========================================================= */

function renderCustomerItem(
    customer,
    conversation
) {

    const customerId =
        customer.id;

    const name =
        customer.full_name ||
        customer.email ||
        "Customer";

    const email =
        customer.email ||
        "";

    const initials =
        getInitials(name);

    const online =
        isCustomerActive(customer);

    const presenceClass =
        online
            ? "online"
            : "offline";

    const presenceText =
        online
            ? "Online"
            : "Offline";

    const avatar =
        customer.avatar_url
            ? `
                <img
                    src="${escapeAttribute(
                        customer.avatar_url
                    )}"
                    alt=""
                >
            `
            : escapeHTML(
                initials
            );

    const lastMessage =
        conversation?.last_message
            ? escapeHTML(
                conversation.last_message
            )
            : `<span class="no-chat-label">
                    No conversation yet
               </span>`;

    const unread =
        Number(
            conversation?.unread_for_admin || 0
        );

    const time =
        conversation?.last_message_at
            ? formatConversationTime(
                conversation.last_message_at
            )
            : "";

    return `
        <div
            class="conversation-item"
            data-customer-id="${escapeAttribute(
                customerId
            )}"
            data-conversation-id="${
                conversation?.id || ""
            }"
        >

            <div class="customer-avatar-wrap">

                <div
                    class="customer-avatar status-${presenceClass}"
                    title="${presenceText}"
                    data-online="${online}"
                >
                    ${avatar}
                </div>

            </div>


            <div class="conversation-info">

                <div class="conversation-top">

                    <div class="customer-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="conversation-time">
                        ${escapeHTML(time)}
                    </div>

                </div>


                <div class="conversation-email">
                    ${escapeHTML(email)}
                </div>


                <div
                    class="
                        customer-presence-label
                        ${presenceClass}
                    "
                >

                    <span class="presence-dot"></span>

                    <span>
                        ${presenceText}
                    </span>

                </div>


                <div class="conversation-preview-row">

                    <div class="conversation-preview">
                        ${lastMessage}
                    </div>

                    ${
                        unread > 0
                            ? `
                                <span class="unread-badge">
                                    ${unread > 99 ? "99+" : unread}
                                </span>
                              `
                            : ""
                    }

                </div>

            </div>

        </div>
    `;

}


/* =========================================================
   OPEN CUSTOMER
   ========================================================= */

async function openCustomerChat(
    customerId
) {

    clearError();

    const customer =
        customers.find(
            item =>
                item.id === customerId
        );

    if (!customer) {
        return;
    }

    selectedCustomer =
        customer;


    /*
       IMPORTANT FIX:

       DO NOT CREATE A CONVERSATION JUST
       BECAUSE THE ADMIN CLICKED A CUSTOMER.

       This is one of the reasons a deleted
       conversation can appear to come back.

       Conversation is now created ONLY
       when a message is actually sent.
    */

    selectedConversation =
        conversations.find(
            conversation =>
                conversation.customer_id ===
                customer.id
        ) || null;


    await removeMessageRealtime();


    updateSelectedCustomerUI();

    enableComposer();


    if (selectedConversation) {

        await loadMessages(
            selectedConversation.id
        );

        await markConversationAsRead(
            selectedConversation.id
        );

        setupMessageRealtime(
            selectedConversation.id
        );

    } else {

        showWelcomeForCustomer();

    }


    renderCustomerList(
        conversationSearch?.value || ""
    );

}

        selectedCustomer.email ||
        "";


    const online =
        isCustomerActive(selectedCustomer);

    setHeaderPresence(

    );


    const avatar =
        selectedCustomer.avatar_url
            ? `
                <img

        `chat-header-avatar status-${
            online
                ? "online"
                : "offline"
        }`;


    deleteConversationButton.disabled =
        !selectedConversation;
