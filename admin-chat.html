/* =========================================================
   LOAD MESSAGES
   ========================================================= */

async function loadMessages(
    conversationId
) {

    showMessageLoading(true);

    try {

        const {
            data,
            error
        } = await supabase
            .from("chat_messages")
            .select("*")
            .eq(
                "conversation_id",
                conversationId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );

        if (error) {
            throw error;
        }

        renderMessages(
            data || []
        );

    } finally {

        showMessageLoading(false);

    }

}


/* =========================================================
   RENDER MESSAGES
   ========================================================= */

function renderMessages(
    messages
) {

    if (!messages.length) {

        showWelcomeForCustomer();

        return;

    }

    adminMessagesContainer.innerHTML = "";

    messages.forEach(
        message => {

            adminMessagesContainer.appendChild(
                createMessageElement(
                    message
                )
            );

        }
    );

    scrollMessagesToBottom();

}


/* =========================================================
   CREATE MESSAGE ELEMENT
   ========================================================= */

function getPublicAttachmentURL(path) {

    if (!path) {
        return "";
    }

    try {
        const {
            data
        } = supabase.storage
            .from(CHAT_BUCKET)
            .getPublicUrl(path);

        return data?.publicUrl || "";

    } catch (error) {

        console.warn(
            "GET ATTACHMENT URL ERROR:",
            error
        );

        return "";

    }

}


function isUsableAttachmentURL(url) {

    if (!url) {
        return false;
    }

    return (
        /^https?:\/\//i.test(url) ||
        url.startsWith("data:") ||
        url.startsWith("blob:")
    );

}


function createMessageElement(
    message
) {

    const isAdmin =
        message.sender_type === "admin";

    const row =
        document.createElement("div");

    row.className =
        `admin-message-row ${
            isAdmin
                ? "admin"
                : "customer"
        }`;

    if (message.id) {
        row.dataset.messageId =
            message.id;
    }

    const content =
        document.createElement("div");

    content.className =
        "admin-message-content";

    const bubble =
        document.createElement("div");

    bubble.className =
        "admin-bubble";

    if (message.message) {

        const text =
            document.createElement("div");

        text.textContent =
            message.message;

        bubble.appendChild(
            text
        );

    }

    /*
       Attachment / image
    */

    const attachmentURL =
        message.attachment_url ||
        getPublicAttachmentURL(
            message.attachment_path
        );

    const attachmentType =
        String(
            message.attachment_type ||
            ""
        ).toLowerCase();

    const attachmentName =
        message.attachment_name ||
        "";

    const looksLikeImage =
        attachmentType.startsWith(
            "image/"
        ) ||
        /\.(jpe?g|png|webp|gif|bmp|avif)(?:[?#].*)?$/i.test(
            attachmentName ||
            attachmentURL ||
            ""
        );

    if (attachmentURL) {

        if (looksLikeImage) {

            const attachmentWrapper =
                document.createElement("div");

            attachmentWrapper.className =
                "attachment-wrapper";

            attachmentWrapper.style.position =
                "relative";

            const image =
                document.createElement("img");

            image.className =
                "chat-attachment";

            image.src =
                attachmentURL;

            image.alt =
                attachmentName ||
                "Customer sent image";

            image.loading =
                "lazy";

            image.decoding =
                "async";

            image.addEventListener(
                "click",
                () => {
                    openImageViewer(
                        image.src
                    );
                }
            );

            image.addEventListener(
                "error",
                async () => {

                    if (
                        !message.attachment_path ||
                        image.dataset.retried === "true"
                    ) {
                        return;
                    }

                    image.dataset.retried =
                        "true";

                    try {

                        const {
                            data: signedData,
                            error: signedError
                        } = await supabase.storage
                            .from(CHAT_BUCKET)
                            .createSignedUrl(
                                message.attachment_path,
                                60 * 60
                            );

                        if (
                            signedError ||
                            !signedData?.signedUrl
                        ) {
                            throw signedError ||
                                new Error(
                                    "Unable to create signed image URL."
                                );
                        }

                        image.src =
                            signedData.signedUrl;

                    } catch (error) {

                        console.warn(
                            "CHAT IMAGE LOAD ERROR:",
                            error
                        );

                        image.alt =
                            "Image unavailable";

                    }

                },
                { once: true }
            );

            attachmentWrapper.appendChild(
                image
            );

            bubble.appendChild(
                attachmentWrapper
            );

        } else {

            const file =
                document.createElement("div");

            file.className =
                "attachment-file";

            file.innerHTML = `
                <span class="attachment-file-icon">
                    📎
                </span>

                <span>
                    ${escapeHTML(
                        attachmentName ||
                        "Attachment"
                    )}
                </span>
            `;

            bubble.appendChild(
                file
            );

        }

    }

    /*
       Delete entire individual message.
       Works for BOTH customer and admin messages.
    */

    if (
        message.id
    ) {

        const deleteButton =
            document.createElement("button");

        deleteButton.type =
            "button";

        deleteButton.className =
            "message-delete-button";

        deleteButton.title =
            "Delete message";

        deleteButton.setAttribute(
            "aria-label",
            "Delete message"
        );

        deleteButton.textContent =
            "×";

        deleteButton.addEventListener(
            "click",
            async event => {

                event.stopPropagation();

                await deleteMessage(
                    message
                );

            }
        );

        content.appendChild(
            deleteButton
        );

    }

    content.appendChild(
        bubble
    );

    const time =
        document.createElement("div");

    time.className =
        "admin-message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    content.appendChild(
        time
    );

    row.appendChild(
        content
    );

    return row;

}

/* =========================================================
   SEND ADMIN MESSAGE
   ========================================================= */

async function sendAdminMessage() {

    if (isSending) {
        return;
    }

    if (!selectedCustomer) {

        showError(
            "Please select a customer first."
        );

        return;

    }


    const message =
        adminMessageInput.value.trim();


    if (
        !message &&
        !selectedFile
    ) {

        return;

    }


    isSending = true;

    setSendLoading(true);

    clearError();


    try {

        /*
           Create conversation ONLY NOW.

           This prevents deleted conversations
           from being recreated merely by clicking
           the customer.
        */

        if (!selectedConversation) {

            selectedConversation =
                await createConversation(
                    selectedCustomer.id
                );

            if (!selectedConversation) {
                throw new Error(
                    "Unable to create conversation."
                );
            }

            updateSelectedCustomerUI();

            await loadMessages(
                selectedConversation.id
            );

            setupMessageRealtime(
                selectedConversation.id
            );

        }


        let attachment =
            null;


        /*
           Upload image first if selected.
        */

        if (selectedFile) {

            attachment =
                await uploadAttachment(
                    selectedFile,
                    selectedConversation.id
                );

        }


        const payload = {

            conversation_id:
                selectedConversation.id,

            sender_id:
                currentAdmin.id,

            sender_type:
                "admin",

            message:
                message || null,

            attachment_url:
                attachment?.url || null,

            attachment_path:
                attachment?.path || null,

            attachment_name:
                attachment?.name || null,

            attachment_type:
                attachment?.type || null

        };


        const {
            data,
            error
        } = await supabase
            .from("chat_messages")
            .insert(
                payload
            )
            .select("*")
            .single();

        if (error) {
            throw error;
        }


        /*
           Realtime will usually render this,
           but we render it locally too if needed.
        */

        if (
            data &&
            !document.querySelector(
                `[data-message-id="${data.id}"]`
            )
        ) {

            adminMessagesContainer.appendChild(
                createMessageElement(
                    data
                )
            );

        }


        adminMessageInput.value =
            "";

        clearSelectedFile();


        await updateConversationAfterMessage(
            selectedConversation.id,
            data
        );


        await refreshConversationPreview(
            selectedConversation.id
        );


        scrollMessagesToBottom();


    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );

        showError(
            friendlyError(error)
        );

    } finally {

        isSending = false;

        setSendLoading(false);

    }

}


/* =========================================================
   CREATE CONVERSATION
   ========================================================= */

async function createConversation(
    customerId
) {

    /*
       First check local state.
    */

    const local =
        conversations.find(
            conversation =>
                conversation.customer_id ===
                customerId
        );

    if (local) {

        deletedConversationIds.delete(
            local.id
        );

        return local;

    }


    /*
       Check DB one more time.
    */

    const {
        data: existing,
        error: existingError
    } = await supabase
        .from("chat_conversations")
        .select("*")
        .eq(
            "customer_id",
            customerId
        )
        .maybeSingle();

    if (existingError) {
        throw existingError;
    }

    if (existing) {

        deletedConversationIds.delete(
            existing.id
        );

        const normalized =
            normalizeConversation(
                existing
            );

        addConversationLocally(
            normalized
        );

        return normalized;

    }


    const now =
        new Date().toISOString();


    const {
        data,
        error
    } = await supabase
        .from("chat_conversations")
        .insert({

            customer_id:
                customerId,

            status:
                "open",

            last_message:
                null,

            last_message_at:
                now,

            last_sender_type:
                null,

            unread_for_customer:
                0,

            unread_for_admin:
                0,

            created_at:
                now,

            updated_at:
                now

        })
        .select("*")
        .single();

    if (error) {

        /*
           Race condition:

           Customer may have created the
           conversation at exactly the same time.
        */

        const {
            data: raceConversation
        } = await supabase
            .from("chat_conversations")
            .select("*")
            .eq(
                "customer_id",
                customerId
            )
            .maybeSingle();

        if (raceConversation) {

            deletedConversationIds.delete(
                raceConversation.id
            );

            const normalized =
                normalizeConversation(
                    raceConversation
                );

            addConversationLocally(
                normalized
            );

            return normalized;

        }

        throw error;

    }


    deletedConversationIds.delete(
        data.id
    );

    const normalized =
        normalizeConversation(
            data
        );

    addConversationLocally(
        normalized
    );

    return normalized;

}


/* =========================================================
   ADD CONVERSATION LOCALLY
   ========================================================= */

function addConversationLocally(
    conversation
) {

    if (
        deletedConversationIds.has(
            conversation.id
        )
    ) {
        return;
    }


    const normalized =
        normalizeConversation(
            conversation
        );

    const index =
        conversations.findIndex(
            item =>
                item.id ===
                normalized.id
        );

    if (index >= 0) {

        conversations[index] =
            normalized;

    } else {

        conversations.push(
            normalized
        );

    }

    renderCustomerList(
        conversationSearch?.value || ""
    );

}


/* =========================================================
   DELETE ENTIRE CONVERSATION
   ========================================================= */

async function deleteConversation() {

    if (
        !selectedConversation ||
        !selectedConversation.id
    ) {

        showError(
            "There is no conversation to delete."
        );

        return;

    }

    const customerName =
        selectedCustomer?.full_name ||
        selectedCustomer?.email ||
        "this customer";

    const confirmed =
        confirm(
            `Delete the entire conversation with ${customerName}?\n\nThis will permanently remove the conversation and all of its messages.`
        );

    if (!confirmed) {
        return;
    }

    const conversationId =
        selectedConversation.id;

    try {

        deleteConversationButton.disabled =
            true;

        clearError();

        /*
           Get attachment paths before deleting messages.
           Storage cleanup is best-effort after DB deletion.
        */

        const {
            data: messagesToDelete,
            error: messageReadError
        } = await supabase
            .from("chat_messages")
            .select("id,attachment_path")
            .eq(
                "conversation_id",
                conversationId
            );

        if (messageReadError) {
            throw messageReadError;
        }

        const attachmentPaths =
            (messagesToDelete || [])
                .map(message =>
                    message?.attachment_path
                )
                .filter(Boolean);

        /*
           Delete child messages first.

           IMPORTANT: no .select() is chained to DELETE.
           Supabase RLS can allow DELETE while blocking SELECT,
           which makes delete().select() look like it failed.
        */

        const {
            error: messageDeleteError
        } = await supabase
            .from("chat_messages")
            .delete()
            .eq(
                "conversation_id",
                conversationId
            );

        if (messageDeleteError) {
            throw messageDeleteError;
        }

        /* Delete the parent conversation. */

        const {
            error: conversationDeleteError
        } = await supabase
            .from("chat_conversations")
            .delete()
            .eq(
                "id",
                conversationId
            );

        if (conversationDeleteError) {
            throw conversationDeleteError;
        }

        /*
           Remove uploaded attachments from Storage too.
           This is intentionally best-effort so a Storage RLS
           problem does not undo an already successful DB delete.
        */

        if (attachmentPaths.length) {

            try {

                const {
                    error: storageDeleteError
                } = await supabase.storage
                    .from(CHAT_BUCKET)
                    .remove(
                        attachmentPaths
                    );

                if (storageDeleteError) {
                    console.warn(
                        "CHAT ATTACHMENT CLEANUP ERROR:",
                        storageDeleteError
                    );
                }

            } catch (storageError) {

                console.warn(
                    "CHAT ATTACHMENT CLEANUP ERROR:",
                    storageError
                );

            }

        }

        /*
           Tombstone first so stale realtime events cannot
           recreate the deleted conversation in the UI.
        */

        deletedConversationIds.add(
            conversationId
        );

        conversations =
            conversations.filter(
                conversation =>
                    conversation.id !==
                    conversationId
            );

        await removeMessageRealtime();

        selectedConversation =
            null;

        updateSelectedCustomerUI();
        showWelcomeForCustomer();

        renderCustomerList(
            conversationSearch?.value || ""
        );

        showSuccess(
            `Conversation deleted successfully. ${messagesToDelete?.length || 0} message(s) removed.`
        );

    } catch (error) {

        console.error(
            "DELETE CONVERSATION ERROR:",
            error
        );

        showError(
            friendlyError(error)
        );

    } finally {

        deleteConversationButton.disabled =
            !selectedConversation;

    }

}

/* =========================================================
   UPDATE CONVERSATION AFTER MESSAGE
   ========================================================= */

async function updateConversationAfterMessage(
    conversationId,
    message
) {

    const now =
        new Date().toISOString();


    const {
        error
    } = await supabase
        .from("chat_conversations")
        .update({

            last_message:
                message?.message ||
                (
                    message?.attachment_name
                        ? "📎 " +
                          message.attachment_name
                        : null
                ),

            last_message_at:
                message?.created_at ||
                now,

            last_sender_type:
                "admin",

            status:
                "open",

            updated_at:
                now

        })
        .eq(
            "id",
            conversationId
        );

    if (error) {
        console.warn(
            "Conversation preview update:",
            error
        );
    }

}


/* =========================================================
   REFRESH CONVERSATION PREVIEW
   ========================================================= */

async function refreshConversationPreview(
    conversationId
) {

    const {
        data: latestMessage
    } = await supabase
        .from("chat_messages")
        .select("*")
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(1)
        .maybeSingle();


    const localConversation =
        conversations.find(
            item =>
                item.id ===
                conversationId
        );


    let lastMessage =
        null;

    let lastMessageAt =
        localConversation?.created_at ||
        new Date().toISOString();

    let lastSenderType =
        null;


    if (latestMessage) {

        lastMessage =
            latestMessage.message ||
            (
                latestMessage.attachment_name
                    ? "📎 " +
                      latestMessage.attachment_name
                    : null
            );

        lastMessageAt =
            latestMessage.created_at ||
            lastMessageAt;

        lastSenderType =
            latestMessage.sender_type ||
            null;

    }


    const {
        data: updated,
        error
    } = await supabase
        .from("chat_conversations")
        .update({

            last_message:
                lastMessage,

            last_message_at:
                lastMessageAt,

            last_sender_type:
                lastSenderType,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            conversationId
        )
        .select("*")
        .maybeSingle();


    if (error) {

        console.warn(
            "REFRESH PREVIEW ERROR:",
            error
        );

        return;

    }


    if (updated) {

        addConversationLocally(
            updated
        );

    }

}


/* =========================================================
   MARK AS READ
   ========================================================= */

async function markConversationAsRead(
    conversationId
) {

    const {
        error
    } = await supabase
        .from("chat_conversations")
        .update({

            unread_for_admin:
                0,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            conversationId
        );

    if (error) {

        console.warn(
            "MARK READ ERROR:",
            error
        );

        return;

    }


    const local =
        conversations.find(
            conversation =>
                conversation.id ===
                conversationId
        );

    if (local) {

        local.unread_for_admin =
            0;

    }

    renderCustomerList(
        conversationSearch?.value || ""
    );

}


/* =========================================================
   MESSAGE REALTIME
   ========================================================= */

function setupMessageRealtime(
    conversationId
) {

    removeMessageRealtime();


    messageChannel =
        supabase
            .channel(
                `admin-chat-messages-${conversationId}-${Date.now()}`
            )
            .on(
                "postgres_changes",
                {
                    event:
                        "INSERT",
                    schema:
                        "public",
                    table:
                        "chat_messages",
                    filter:
                        `conversation_id=eq.${conversationId}`
                },
                payload => {

                    if (
                        !payload.new
                    ) {
                        return;
                    }


                    /*
                       Avoid duplicate admin message
                       if it was already rendered locally.
                    */

                    if (
                        document.querySelector(
                            `[data-message-id="${payload.new.id}"]`
                        )
                    ) {
                        return;
                    }


                    /*
                       Only render messages belonging
                       to the currently selected conversation.
                    */

                    if (
                        selectedConversation?.id !==
                        conversationId
                    ) {
                        return;
                    }


                    adminMessagesContainer.appendChild(
                        createMessageElement(
                            payload.new
                        )
                    );


                    scrollMessagesToBottom();


                    /*
                       Customer sent a message.
                    */

                    if (
                        payload.new.sender_type ===
                        "customer"
                    ) {

                        markConversationAsRead(
                            conversationId
                        );

                    }

                }
            )
            .on(
                "postgres_changes",
                {
                    event:
                        "DELETE",
                    schema:
                        "public",
                    table:
                        "chat_messages",
                    filter:
                        `conversation_id=eq.${conversationId}`
                },
                payload => {

                    const id =
                        payload.old?.id;

                    if (!id) {
                        return;
                    }

                    const element =
                        document.querySelector(
                            `[data-message-id="${id}"]`
                        );

                    element?.remove();

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Admin message channel:",
                        status
                    );

                }
            );

}


/* =========================================================
   REMOVE MESSAGE REALTIME
   ========================================================= */

async function removeMessageRealtime() {

    if (!messageChannel) {
        return;
    }

    try {

        await supabase.removeChannel(
            messageChannel
        );

    } catch (error) {

        console.warn(
            "REMOVE MESSAGE CHANNEL:",
            error
        );

    }

    messageChannel =
        null;

}


/* =========================================================
   DELETE INDIVIDUAL MESSAGE
   ========================================================= */

async function deleteMessage(
    message
) {

    if (!message?.id) {
        return;
    }

    const confirmed =
        confirm(
            "Permanently delete this message?\n\nThis removes the message from the database and permanently removes its attached image/file from Storage."
        );

    if (!confirmed) {
        return;
    }

    try {

        /*
           Permanently remove the attached file first.
           If Storage refuses the delete, keep the database message
           untouched so the message and its attachment stay consistent.
        */
        if (message.attachment_path) {

            const {
                error: storageError
            } = await supabase.storage
                .from(CHAT_BUCKET)
                .remove([
                    message.attachment_path
                ]);

            if (storageError) {
                throw new Error(
                    `The message could not be permanently deleted because its attachment could not be removed from Storage. ${storageError.message || ""}`
                );
            }

        }

        /*
           Now permanently remove the COMPLETE message row.
           This removes the text, image reference, and the whole
           message container from the chat.
        */
        const {
            error
        } = await supabase
            .from("chat_messages")
            .delete()
            .eq(
                "id",
                message.id
            );

        if (error) {
            throw error;
        }

        const element =
            document.querySelector(
                `[data-message-id="${message.id}"]`
            );

        element?.remove();

        if (
            selectedConversation?.id
        ) {

            await refreshConversationPreview(
                selectedConversation.id
            );

        }

        showSuccess(
            "Message deleted successfully."
        );

    } catch (error) {

        console.error(
            "DELETE MESSAGE ERROR:",
            error
        );

        showError(
            friendlyError(error)
        );

    }

}


/* =========================================================
   CONVERSATION REALTIME
   ========================================================= */

function setupConversationRealtime() {

    if (conversationChannel) {

        supabase.removeChannel(
            conversationChannel
        );

    }


    conversationChannel =
        supabase
            .channel(
                `admin-chat-conversations-${Date.now()}`
            )


            /* =================================================
               INSERT
               ================================================= */

            .on(
                "postgres_changes",
                {
                    event:
                        "INSERT",
                    schema:
                        "public",
                    table:
                        "chat_conversations"
                },
                payload => {

                    const newConversation =
                        payload.new;

                    if (
                        !newConversation?.id
                    ) {
                        return;
                    }


                    /*
                       Ignore stale event for deleted conversation.
                    */

                    if (
                        deletedConversationIds.has(
                            newConversation.id
                        )
                    ) {
                        return;
                    }


                    const normalized =
                        normalizeConversation(
                            newConversation
                        );


                    addConversationLocally(
                        normalized
                    );


                    /*
                       If this customer is currently selected
                       and there was no conversation before,
                       automatically open the newly-created one.
                    */

                    if (
                        selectedCustomer?.id ===
                        newConversation.customer_id &&
                        !selectedConversation
                    ) {

                        selectedConversation =
                            normalized;

                        updateSelectedCustomerUI();

                        loadMessages(
                            normalized.id
                        );

                        setupMessageRealtime(
                            normalized.id
                        );

                    }

                }
            )


            /* =================================================
               UPDATE
               ================================================= */

            .on(
                "postgres_changes",
                {
                    event:
                        "UPDATE",
                    schema:
                        "public",
                    table:
                        "chat_conversations"
                },
                payload => {

                    const updated =
                        payload.new;

                    if (
                        !updated?.id
                    ) {
                        return;
                    }


                    /*
                       CRITICAL FIX:

                       Never allow an UPDATE belonging
                       to a deleted conversation to recreate it.
                    */

                    if (
                        deletedConversationIds.has(
                            updated.id
                        )
                    ) {

                        console.log(
                            "Ignored stale UPDATE for deleted conversation:",
                            updated.id
                        );

                        return;

                    }


                    addConversationLocally(
                        updated
                    );


                    /*
                       Keep selected conversation synchronized.
                    */

                    if (
                        selectedConversation?.id ===
                        updated.id
                    ) {

                        selectedConversation =
                            normalizeConversation(
                                updated
                            );

                        updateSelectedCustomerUI();

                    }

                }
            )


            /* =================================================
               DELETE
               ================================================= */

            .on(
                "postgres_changes",
                {
                    event:
                        "DELETE",
                    schema:
                        "public",
                    table:
                        "chat_conversations"
                },
                payload => {

                    /*
                       Supabase normally provides the primary key
                       in payload.old for DELETE.
                    */

                    const deletedId =
                        payload.old?.id;


                    if (!deletedId) {

                        console.warn(
                            "Conversation DELETE received without old.id:",
                            payload
                        );

                        return;

                    }


                    console.log(
                        "Conversation deleted:",
                        deletedId
                    );


                    /*
                       Tombstone.
                    */

                    deletedConversationIds.add(
                        deletedId
                    );


                    /*
                       Remove from local state.
                    */

                    conversations =
                        conversations.filter(
                            conversation =>
                                conversation.id !==
                                deletedId
                        );


                    /*
                       If currently selected, clear it.
                    */

                    if (
                        selectedConversation?.id ===
                        deletedId
                    ) {

                        selectedConversation =
                            null;

                        removeMessageRealtime();

                        showWelcomeForCustomer();

                        updateSelectedCustomerUI();

                    }


                    /*
                       Re-render customer list.
                    */

                    renderCustomerList(
                        conversationSearch?.value || ""
                    );

                }
            )


            .subscribe(
                status => {

                    console.log(
                        "Admin conversation channel:",
                        status
                    );

                    if (
                        status === "SUBSCRIBED"
                    ) {

                        setConnectionStatus(
                            "online"
                        );

                    }

                }
            );

}


/* =========================================================
   CUSTOMER ONLINE / OFFLINE
   Based on admin-users.html:
   last_login within the last 30 minutes = Online
   ========================================================= */

function isCustomerActive(user) {

    if (!user?.last_login) {
        return false;
    }

    const lastSeen =
        new Date(
            user.last_login
        ).getTime();

    if (Number.isNaN(lastSeen)) {
        return false;
    }

    const difference =
        Date.now() - lastSeen;

    const windowMs =
        ACTIVE_WINDOW_MINUTES *
        60 *
        1000;

    return (
        difference >= 0 &&
        difference <= windowMs
    );

}


async function refreshCustomerActivity() {

    try {

        const {
            data: customerRows,
            error
        } = await supabase
            .from("profiles")
            .select(
                "id,email,full_name,role,status,avatar_url,last_login"
            )
            .eq(
                "role",
                "customer"
            )
            .order(
                "full_name",
                {
                    ascending: true
                }
            );

        if (error) {
            throw error;
        }

        customers =
            customerRows || [];

        /* Keep conversation customer references fresh. */
        conversations =
            conversations.map(
                conversation => ({
                    ...conversation,
                    customer:
                        customers.find(
                            customer =>
                                customer.id ===
                                conversation.customer_id
                        ) || null
                })
            );

        /* Rebuild the local status set using the exact
           same 30-minute last_login rule. */
        customerPresence =
            new Set(
                customers
                    .filter(isCustomerActive)
                    .map(customer => String(customer.id))
            );

        if (selectedCustomer?.id) {
            selectedCustomer =
                customers.find(
                    customer =>
                        customer.id ===
                        selectedCustomer.id
                ) || selectedCustomer;
        }

        updateSelectedCustomerUI();

        renderCustomerList(
            conversationSearch?.value || ""
        );

    } catch (error) {

        console.warn(
            "CUSTOMER ACTIVITY REFRESH ERROR:",
            error
        );

    }

}


function startActivityRefresh() {

    if (activityRefreshTimer) {
        clearInterval(
            activityRefreshTimer
        );
    }

    activityRefreshTimer =
        setInterval(
            refreshCustomerActivity,
            30 * 1000
        );

    window.addEventListener(
        "focus",
        refreshCustomerActivity
    );

    window.addEventListener(
        "pageshow",
        refreshCustomerActivity
    );

    document.addEventListener(
        "visibilitychange",
        () => {
            if (!document.hidden) {
                refreshCustomerActivity();
            }
        }
    );

}


function setupProfileRealtime() {

    if (profileRealtimeChannel) {
        supabase.removeChannel(
            profileRealtimeChannel
        );
    }

    profileRealtimeChannel =
        supabase
            .channel(
                `admin-chat-profiles-${Date.now()}`
            )
            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "profiles"
                },
                payload => {

                    if (
                        payload.new?.role !==
                        "customer"
                    ) {
                        return;
                    }

                    const index =
                        customers.findIndex(
                            customer =>
                                customer.id ===
                                payload.new.id
                        );

                    if (index === -1) {
                        refreshCustomerActivity();
                        return;
                    }

                    customers[index] = {
                        ...customers[index],
                        ...payload.new
                    };

                    customerPresence =
                        new Set(
                            customers
                                .filter(isCustomerActive)
                                .map(customer => String(customer.id))
                        );

                    if (
                        selectedCustomer?.id ===
                        payload.new.id
                    ) {
                        selectedCustomer =
                            customers[index];
                    }

                    updateSelectedCustomerUI();

                    renderCustomerList(
                        conversationSearch?.value || ""
                    );

                }
            )
            .subscribe(
                status => {
                    console.log(
                        "Admin profile activity channel:",
                        status
                    );
                }
            );

}


/* =========================================================
   FILE UPLOAD
   ========================================================= */

async function uploadAttachment(
    file,
    conversationId
) {

    if (!file) {
        return null;
    }


    if (
        !ALLOWED_IMAGE_TYPES.includes(
            file.type
        )
    ) {

        throw new Error(
            "Only JPG, PNG, and WEBP images are allowed."
        );

    }


    if (
        file.size >
        MAX_FILE_SIZE
    ) {

        throw new Error(
            "Image must be 5MB or smaller."
        );

    }


    const extension =
        getFileExtension(
            file.name
        );


    const randomPart =
        crypto.randomUUID();


    const path =
        `admin/${conversationId}/${randomPart}.${extension}`;


    const {
        error
    } = await supabase.storage
        .from(
            CHAT_BUCKET
        )
        .upload(
            path,
            file,
            {
                cacheControl:
                    "3600",

                upsert:
                    false,

                contentType:
                    file.type
            }
        );


    if (error) {
        throw error;
    }


    const {
        data
    } = supabase.storage
        .from(
            CHAT_BUCKET
        )
        .getPublicUrl(
            path
        );


    return {

        url:
            data?.publicUrl ||
            "",

        path,

        name:
            file.name,

        type:
            file.type

    };

}


/* =========================================================
   ATTACHMENT INPUT
   ========================================================= */

function handleAttachment(
    event
) {

    const file =
        event.target.files?.[0];

    if (!file) {
        return;
    }


    if (
        !ALLOWED_IMAGE_TYPES.includes(
            file.type
        )
    ) {

        showError(
            "Only JPG, PNG, and WEBP images are allowed."
        );

        event.target.value =
            "";

        return;

    }


    if (
        file.size >
        MAX_FILE_SIZE
    ) {

        showError(
            "Image must be 5MB or smaller."
        );

        event.target.value =
            "";

        return;

    }


    selectedFile =
        file;


    if (previewObjectURL) {

        URL.revokeObjectURL(
            previewObjectURL
        );

    }


    previewObjectURL =
        URL.createObjectURL(
            file
        );


    adminPreviewImage.src =
        previewObjectURL;

    adminPreviewName.textContent =
        file.name;

    adminAttachmentPreview.classList.add(
        "show"
    );


    clearError();

}


/* =========================================================
   CLEAR FILE
   ========================================================= */

function clearSelectedFile() {

    selectedFile =
        null;


    if (previewObjectURL) {

        URL.revokeObjectURL(
            previewObjectURL
        );

        previewObjectURL =
            null;

    }


    adminPreviewImage.src =
        "";

    adminPreviewName.textContent =
        "";

    adminAttachmentPreview.classList.remove(
        "show"
    );


    if (adminAttachmentInput) {

        adminAttachmentInput.value =
            "";

    }

}


/* =========================================================
   EVENTS
   ========================================================= */

function setupEvents() {

    /*
       Customer list click
    */

    conversationList?.addEventListener(
        "click",
        event => {

            const item =
                event.target.closest(
                    ".conversation-item"
                );

            if (!item) {
                return;
            }


            const customerId =
                item.dataset.customerId;

            openCustomerChat(
                customerId
            );


            closeMobileCustomers();

        }
    );


    /*
       Search
    */

    conversationSearch?.addEventListener(
        "input",
        () => {

            renderCustomerList(
                conversationSearch.value
            );

        }
    );


    /*
       Filter buttons
    */

    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".filter-button"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        button.classList.add(
                            "active"
                        );


                        renderCustomerList(
                            conversationSearch?.value ||
                            ""
                        );

                    }
                );

            }
        );


    /*
       Send
    */

    adminSendButton?.addEventListener(
        "click",
        sendAdminMessage
    );


    /*
       Enter to send
    */

    adminMessageInput?.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendAdminMessage();

            }

        }
    );


    /*
       Attachment
    */

    adminAttachmentInput?.addEventListener(
        "change",
        handleAttachment
    );


    adminRemoveAttachment?.addEventListener(
        "click",
        clearSelectedFile
    );


    /*
       Refresh
    */

    refreshChatButton?.addEventListener(
        "click",
        async () => {

            try {

                clearError();

                await loadCustomersAndConversations();

                renderCustomerList(
                    conversationSearch?.value ||
                    ""
                );


                if (
                    selectedConversation
                ) {

                    await loadMessages(
                        selectedConversation.id
                    );

                }

                updateSelectedCustomerUI();

            } catch (error) {

                console.error(
                    error
                );

                showError(
                    friendlyError(error)
                );

            }

        }
    );


    /*
       DELETE ENTIRE CONVERSATION
    */

    deleteConversationButton?.addEventListener(
        "click",
        deleteConversation
    );


    /*
       Mobile
    */

    mobileConversationsButton?.addEventListener(
        "click",
        openMobileCustomers
    );


    mobileChatBackdrop?.addEventListener(
        "click",
        closeMobileCustomers
    );


    /*
       Image viewer
    */

    adminImageClose?.addEventListener(
        "click",
        closeImageViewer
    );


    adminImageViewer?.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                adminImageViewer
            ) {

                closeImageViewer();

            }

        }
    );


    /*
       Back dashboard
    */

    document
        .getElementById(
            "backToDashboardButton"
        )
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "admin.html";

            }
        );


    /*
       Escape
    */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closeImageViewer();

                closeMobileCustomers();

            }

        }
    );


    /*
       Global functions.

       This also supports old HTML buttons
       that use onclick="deleteConversation()".
    */

    window.deleteConversation =
        deleteConversation;

    window.deleteAdminConversation =
        deleteConversation;

}


/* =========================================================
   MOBILE CUSTOMER DRAWER
   ========================================================= */

function openMobileCustomers() {

    conversationsPanel?.classList.add(
        "mobile-open"
    );

    mobileChatBackdrop?.classList.add(
        "show"
    );

}


function closeMobileCustomers() {

    conversationsPanel?.classList.remove(
        "mobile-open"
    );

    mobileChatBackdrop?.classList.remove(
        "show"
    );

}


/* =========================================================
   ENABLE COMPOSER
   ========================================================= */

function enableComposer() {

    adminMessageInput.disabled =
        false;

    adminSendButton.disabled =
        false;

    adminMessageInput.placeholder =
        "Type a message...";

}


/* =========================================================
   DISABLE COMPOSER
   ========================================================= */

function disableComposer() {

    adminMessageInput.disabled =
        true;

    adminSendButton.disabled =
        true;

    adminMessageInput.placeholder =
        "Select a customer first...";

}


/* =========================================================
   SEND LOADING
   ========================================================= */

function setSendLoading(
    loading
) {

    if (!adminSendButton) {
        return;
    }

    adminSendButton.classList.toggle(
        "sending",
        loading
    );

    adminSendButton.disabled =
        loading ||
        !selectedCustomer;

}


/* =========================================================
   MESSAGE LOADING
   ========================================================= */

function showMessageLoading(
    show
) {

    adminChatLoading?.classList.toggle(
        "show",
        show
    );

}


/* =========================================================
   CONVERSATION LOADING
   ========================================================= */

function showConversationLoading(
    show
) {

    conversationLoading?.classList.toggle(
        "show",
        show
    );

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollMessagesToBottom() {

    requestAnimationFrame(
        () => {

            adminMessagesContainer.scrollTop =
                adminMessagesContainer.scrollHeight;

        }
    );

}


/* =========================================================
   IMAGE VIEWER
   ========================================================= */

function openImageViewer(
    url
) {

    if (
        !url ||
        !adminImageViewer ||
        !adminViewerImage
    ) {
        return;
    }

    adminViewerImage.src =
        url;

    adminImageViewer.classList.add(
        "show"
    );

}


function closeImageViewer() {

    adminImageViewer?.classList.remove(
        "show"
    );

}


/* =========================================================
   CONNECTION STATUS
   ========================================================= */

function setConnectionStatus(
    status
) {

    const wrapper =
        document.querySelector(
            ".chat-status"
        );

    const text =
        document.getElementById(
            "connectionStatus"
        );


    if (!wrapper || !text) {
        return;
    }


    wrapper.classList.remove(
        "online",
        "offline",
        "connecting"
    );


    if (
        status ===
        "online"
    ) {

        wrapper.classList.add(
            "online"
        );

        text.textContent =
            "Online";

        return;

    }


    if (
        status ===
        "offline"
    ) {

        wrapper.classList.add(
            "offline"
        );

        text.textContent =
            "Offline";

        return;

    }


    wrapper.classList.add(
        "connecting"
    );

    text.textContent =
        "Connecting...";

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
    message
) {

    if (!adminChatError) {
        return;
    }

    adminChatError.textContent =
        message || "Something went wrong.";

    adminChatError.classList.add(
        "show"
    );

}


function showSuccess(
    message
) {

    if (!adminChatError) {
        return;
    }

    adminChatError.textContent =
        message;

    adminChatError.style.background =
        "rgba(53,232,137,.08)";

    adminChatError.style.borderColor =
        "rgba(53,232,137,.18)";

    adminChatError.style.color =
        "#35e889";

    adminChatError.classList.add(
        "show"
    );


    setTimeout(
        () => {

            clearError();

        },
        2500
    );

}


function clearError() {

    if (!adminChatError) {
        return;
    }

    adminChatError.textContent =
        "";

    adminChatError.classList.remove(
        "show"
    );

    adminChatError.style.background =
        "";

    adminChatError.style.borderColor =
        "";

    adminChatError.style.color =
        "";

}


/* =========================================================
   FRIENDLY ERROR
   ========================================================= */

function friendlyError(
    error
) {

    const message =
        error?.message ||
        String(error || "Unknown error");


    if (
        message.includes(
            "row-level security"
        )
    ) {

        return (
            "Supabase RLS blocked this action. " +
            "Check the chat_conversations/chat_messages policies."
        );

    }


    if (
        message.includes(
            "JWT"
        )
    ) {

        return (
            "Your admin session expired. " +
            "Please login again."
        );

    }


    if (
        message.includes(
            "Failed to fetch"
        )
    ) {

        return (
            "Network connection failed. " +
            "Please check your internet connection."
        );

    }


    return message;

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatMessageTime(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleString(
        "en-PH",
        {
            month:
                "short",

            day:
                "numeric",

            hour:
                "numeric",

            minute:
                "2-digit"
        }
    );

}


function formatConversationTime(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    const now =
        new Date();

    const diff =
        now.getTime() -
        date.getTime();


    if (
        diff <
        60 * 1000
    ) {

        return "now";

    }


    if (
        diff <
        60 * 60 * 1000
    ) {

        return (
            Math.floor(
                diff /
                (60 * 1000)
            ) +
            "m"
        );

    }


    if (
        diff <
        24 * 60 * 60 * 1000
    ) {

        return (
            Math.floor(
                diff /
                (60 * 60 * 1000)
            ) +
            "h"
        );

    }


    return date.toLocaleDateString(
        "en-PH",
        {
            month:
                "short",

            day:
                "numeric"
        }
    );

}


/* =========================================================
   INITIALS
   ========================================================= */

function getInitials(
    value
) {

    const text =
        String(
            value || "Customer"
        ).trim();

    if (!text) {
        return "C";
    }


    const parts =
        text
            .split(/\s+/)
            .filter(Boolean);


    if (
        parts.length === 1
    ) {

        return parts[0]
            .slice(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


/* =========================================================
   FILE EXTENSION
   ========================================================= */

function getFileExtension(
    filename
) {

    const parts =
        String(
            filename || ""
        ).split(".");

    return (
        parts.length > 1
            ? parts.pop()
            : "jpg"
    )
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        ) || "jpg";

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


/* =========================================================
   BEFORE UNLOAD CLEANUP
   ========================================================= */

window.addEventListener(
    "beforeunload",
    async () => {

        try {

            if (messageChannel) {

                await supabase.removeChannel(
                    messageChannel
                );

            }

            if (conversationChannel) {

                await supabase.removeChannel(
                    conversationChannel
                );

            }

            if (presenceChannel) {

                await supabase.removeChannel(
                    presenceChannel
                );

            }

        } catch (error) {

            console.warn(
                "Chat cleanup:",
                error
            );

        }

    }
);

</script>
